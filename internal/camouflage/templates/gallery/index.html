:root{--ink:#1b1b1f;--sub:#8a8a93;--bg:#111114;--card:#1b1b20;--line:#2a2a31;--brand:#e8b04b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#e8e8ea;line-height:1.7}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;background:#111114e8;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:9}
.nav{display:flex;height:62px;align-items:center;gap:26px}
.logo{font-size:18px;font-weight:700;letter-spacing:2px}
.logo i{color:var(--brand);font-style:normal}
.nav a{font-size:14px;color:#b9b9c0}
.nav a.on{color:var(--brand)}
.hero{text-align:center;padding:60px 0 40px}
.hero h1{font-size:30px;letter-spacing:4px;font-weight:600}
.hero p{color:var(--sub);font-size:14px;margin-top:10px}
.filters{display:flex;gap:10px;justify-content:center;margin:22px 0 30px;flex-wrap:wrap}
.filters span{border:1px solid var(--line);border-radius:999px;padding:6px 18px;font-size:13px;color:#c9c9d2}
.filters .on{background:var(--brand);color:#141414;border-color:var(--brand);font-weight:600}
.grid{columns:3 300px;column-gap:16px;padding-bottom:50px}
figure{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 16px;transition:.25s}
figure:hover{transform:translateY(-4px);border-color:#3a3a44}
figure svg{display:block;width:100%}
figcaption{padding:12px 15px;font-size:13.5px;color:#c9c9d2;display:flex;justify-content:space-between;gap:10px}
figcaption small{color:var(--sub);font-size:12px;white-space:nowrap}
footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--sub);font-size:12.5px}
</style>
</head>
